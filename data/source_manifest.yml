version: 3
updated_at: 2026-09-12
purpose: point_in_time_market_prediction
sources:
  market:
    provider: Stooq
    dataset: daily_ohlcv
    initial_symbol: '^spx'
    availability: historical_csv
    primary_use: technical_features
    caveat: cash_index_data_is_not_executable_futures_data
  macro:
    provider: Federal_Reserve_Bank_of_St_Louis
    datasets: FRED_ALFRED
    api: https://api.stlouisfed.org/fred/series/observations
    point_in_time_rule: select_vintage_known_before_decision_time
    default_conservative_lag_days: 1
    initial_series:
      - FEDFUNDS
      - DGS10
      - CPIAUCSL
      - UNRATE
      - VIXCLS
    excluded_series:
      - DFF
    primary_use: macro_features
  events:
    provider: GDELT_Project
    production_dataset: GDELT_1_Daily_Event_Database
    production_archive: https://data.gdeltproject.org/events/
    coverage_start: 2015-02-19
    coverage_end: 2025-12-31
    availability_field: conservative_next_day_boundary
    availability_timezone: UTC
    production_availability_policy: 12:00 UTC on day after file date
    publication_time: unknown
    primary_use: geopolitical_and_event_features
    caveat: production_track is GDELT 1.0 daily data; it is not GDELT 2.0
    research_track:
      dataset: GDELT_2_Event_Database
      archive: https://data.gdeltproject.org/gdeltv2/
      update_interval: 15_minutes
      availability_field: DATEADDED
      status: acquisition_and_validation_only
  scandals_and_fraud:
    provider: U.S._Securities_and_Exchange_Commission
    dataset: Litigation_Releases
    archive: https://www.sec.gov/enforcement-litigation/litigation-releases
    primary_use: corporate_scandal_and_financial_fraud_events
    status: current_RSS_snapshot_not_verified_2000_2025_archive
rules:
  - preserve_original_source_fields_before_normalization
  - never_replace_information_available_time_with_later_confirmation_time
  - keep_raw_and_normalized_event_ids
  - do_not_use_current_fred_revisions_as_historical_features
  - do_not_commit_large_raw_archives_to_git
  - final_lockbox_fails_closed_on_unresolved_required_gdelt_source_days
