name: Real A/B Window — 2015-2025

on:
  push:
    branches: [fix/baseline-finite-features]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-ab-window-2015-2025
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  AB_START: "2015-01-01"
  AB_END: "2025-12-31"

jobs:
  real-ab:
    name: REAL A + B + FINANCIAL COMPARISON
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Execute real A/B on common PIT window
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/run_real_ab_window.py
      - name: Run existing focused regression and PIT tests
        run: python -m pytest -q tests/test_features.py tests/test_dataset.py tests/test_experiments.py tests/test_fred_pit.py
      - name: Publish real A/B artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: real-ab-window-${{ github.sha }}
          path: data/real_ab_window/
          if-no-files-found: error
          retention-days: 30
