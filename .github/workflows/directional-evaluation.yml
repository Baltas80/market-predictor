name: Directional Evaluation

on:
  pull_request:
    paths:
      - "src/market_predictor/directional.py"
      - "src/market_predictor/pipeline.py"
      - "tests/test_directional.py"
      - "tests/test_directional_pipeline.py"
      - ".github/workflows/directional-evaluation.yml"
  push:
    paths:
      - "src/market_predictor/directional.py"
      - "src/market_predictor/pipeline.py"
      - "tests/test_directional.py"
      - "tests/test_directional_pipeline.py"
      - ".github/workflows/directional-evaluation.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Run directional tests
        run: python -m pytest -q tests/test_directional.py tests/test_directional_pipeline.py
