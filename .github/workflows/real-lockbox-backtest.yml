name: Real Historical Lockbox Backtest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: real-lockbox-main
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  stage-base:
    name: STAGE MARKET + FRED
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Runner diagnostics
        run: |
          python --version
          python -c "import os; print('CPUs:', os.cpu_count())"
          df -h
          free -h
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Stage base historical data without GDELT or SEC RSS
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "FRED/base staging attempt ${attempt}/3"
            python scripts/ingest_historical.py --output-dir data/historical --execute --skip-gdelt --skip-sec
            status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Base staging failed (exit ${status}); waiting 90s for transient API/rate-limit recovery..."
              rm -rf data/historical
              sleep 90
            fi
          done
          exit "$status"
      - name: Persist base staging
        uses: actions/upload-artifact@v7
        with:
          name: historical-base-${{ github.sha }}
          path: data/historical/
          if-no-files-found: error
          retention-days: 7

  prepare-gdelt-matrix:
    name: PREPARE 28-DAY GDELT MATRIX
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build 28-day chunk matrix
        id: matrix
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, json
          # GDELT 1.0 daily event archives begin on 2015-02-19 in this project.
          # Do not create impossible source-day gaps for dates before the dataset existed.
          start = datetime.date(2015, 2, 19)
          end = datetime.date(2025, 12, 31)
          rows = []
          cur = start
          chunk = 1
          while cur <= end:
              chunk_end = min(cur + datetime.timedelta(days=27), end)
              rows.append({"chunk": chunk, "start": cur.isoformat(), "end": chunk_end.isoformat()})
              cur = chunk_end + datetime.timedelta(days=1)
              chunk += 1
          print("matrix=" + json.dumps({"include": rows}, separators=(",", ":")))
          print(f"chunks={len(rows)}", file=__import__('sys').stderr)
          PY

  gdelt-chunks:
    name: GDELT ${{ matrix.start }} → ${{ matrix.end }}
    needs: prepare-gdelt-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Restore previous completed daily checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/gdelt_chunks
          artifact_name="gdelt-${{ matrix.chunk }}-${{ matrix.start }}-${{ matrix.end }}"
          echo "Looking for reusable checkpoint artifact: ${artifact_name}"
          artifact_id="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100" \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | last | .id // empty')"
          if [[ -n "${artifact_id}" ]]; then
            echo "Restoring artifact ${artifact_id} (${artifact_name})"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/gdelt-checkpoint.zip
            unzip -o /tmp/gdelt-checkpoint.zip -d data/gdelt_chunks >/dev/null
            echo "Checkpoint restore complete"
          else
            echo "No previous checkpoint artifact found; starting this chunk from scratch"
          fi
      - name: Download and persist 28-day GDELT chunk
        run: |
          python scripts/ingest_gdelt_chunk.py \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --output "data/gdelt_chunks/gdelt_${{ matrix.chunk }}_${{ matrix.start }}_${{ matrix.end }}.csv" \
            --missing-output "data/gdelt_chunks/gdelt_${{ matrix.chunk }}_missing.csv" \
            --checkpoint-dir "data/gdelt_chunks/gdelt_${{ matrix.chunk }}_${{ matrix.start }}_${{ matrix.end }}_days"
      - name: Upload completed GDELT chunk and daily checkpoints
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gdelt-${{ matrix.chunk }}-${{ matrix.start }}-${{ matrix.end }}
          path: data/gdelt_chunks/
          if-no-files-found: ignore
          retention-days: 7

  recover-gdelt-gaps:
    name: RECOVER GDELT GAPS ONLY
    needs: gdelt-chunks
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Download GDELT chunk artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: gdelt-*
          path: data/gdelt_chunks
          merge-multiple: true
      - name: Retry only recorded missing source-days with canonical loader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/gdelt_recovery
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          import subprocess
          import sys

          chunks = Path("data/gdelt_chunks")
          recovery = Path("data/gdelt_recovery")
          manifests = sorted(chunks.glob("gdelt_*_missing.csv"))
          dates = set()
          for path in manifests:
              try:
                  frame = pd.read_csv(path)
              except pd.errors.EmptyDataError:
                  continue
              if frame.empty or "date" not in frame.columns:
                  continue
              for value in frame["date"].dropna().astype(str):
                  dates.add(value[:10])

          print(f"Recorded GDELT gap source-days: {len(dates)}")
          for day in sorted(dates):
              output = recovery / f"gdelt_{day}.csv"
              missing = recovery / f"gdelt_{day}_missing.csv"
              checkpoint = recovery / f"gdelt_{day}_days"
              print(f"Recovering GDELT source-day {day}", flush=True)
              subprocess.run(
                  [
                      sys.executable,
                      "scripts/ingest_gdelt_chunk.py",
                      "--start", day,
                      "--end", day,
                      "--output", str(output),
                      "--missing-output", str(missing),
                      "--checkpoint-dir", str(checkpoint),
                  ],
                  check=True,
              )
          PY
      - name: Assemble recovery manifests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          recovery = Path("data/gdelt_recovery")
          data_files = sorted(recovery.glob("gdelt_????-??-??.csv"))
          missing_files = sorted(recovery.glob("gdelt_????-??-??_missing.csv"))

          data_frames = []
          for path in data_files:
              frame = pd.read_csv(path)
              if not frame.empty:
                  data_frames.append(frame)
          if data_frames:
              pd.concat(data_frames, ignore_index=True).to_csv(
                  recovery / "gdelt_recovered.csv", index=False, lineterminator="\n"
              )
          else:
              (recovery / "gdelt_recovered.csv").write_text("\n", encoding="utf-8")

          missing_frames = []
          for path in missing_files:
              try:
                  frame = pd.read_csv(path)
              except pd.errors.EmptyDataError:
                  continue
              if not frame.empty:
                  missing_frames.append(frame)
          if missing_frames:
              pd.concat(missing_frames, ignore_index=True).to_csv(
                  recovery / "gdelt_recovery_missing.csv", index=False, lineterminator="\n"
              )
          else:
              (recovery / "gdelt_recovery_missing.csv").write_text("date,source_id,status,error_type,error\n", encoding="utf-8")
          PY
      - name: Upload recovery results
        uses: actions/upload-artifact@v7
        with:
          name: gdelt-recovery-${{ github.sha }}
          path: |
            data/gdelt_recovery/gdelt_recovered.csv
            data/gdelt_recovery/gdelt_recovery_missing.csv
          if-no-files-found: error
          retention-days: 7

  finalize-staging:
    name: ASSEMBLE + HISTORICAL GATE
    needs: [stage-base, recover-gdelt-gaps]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Download base staging
        uses: actions/download-artifact@v8
        with:
          name: historical-base-${{ github.sha }}
          path: data/historical
      - name: Download persisted GDELT chunks
        uses: actions/download-artifact@v8
        with:
          pattern: gdelt-*
          path: data/gdelt_chunks
          merge-multiple: true
      - name: Download GDELT recovery results
        uses: actions/download-artifact@v8
        with:
          name: gdelt-recovery-${{ github.sha }}
          path: data/gdelt_chunks
      - name: Assemble and validate historical staging
        run: python scripts/finalize_historical_staging.py --staging data/historical --chunks data/gdelt_chunks
      - name: Persist final historical staging
        uses: actions/upload-artifact@v7
        with:
          name: historical-final-${{ github.sha }}
          path: data/historical/
          if-no-files-found: error
          retention-days: 30

  real-lockbox:
    name: REAL DATA → PIT → A/B/C → LOCKBOX → FINANCIAL REPORT
    needs: finalize-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Download final historical staging
        uses: actions/download-artifact@v8
        with:
          name: historical-final-${{ github.sha }}
          path: data/historical
      - name: Run frozen A/B/C lockbox and financial evaluation
        run: python scripts/run_real_lockbox.py --staging data/historical --output data/results
      - name: Run regression suite
        run: python -m pytest -q
      - name: Upload real-data results
        uses: actions/upload-artifact@v7
        with:
          name: real-lockbox-results-${{ github.sha }}
          path: |
            data/results/
            data/historical/staging_result.json
            data/historical/source_manifest.json
          if-no-files-found: error
          retention-days: 30
