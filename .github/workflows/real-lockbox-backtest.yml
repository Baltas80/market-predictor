name: Real Historical Lockbox Backtest

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_real_lockbox.py"
      - ".github/workflows/real-lockbox-backtest.yml"
      - "src/market_predictor/**"
      - "scripts/ingest_historical.py"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-lockbox:
    name: REAL DATA → PIT → A/B/C → LOCKBOX → FINANCIAL REPORT
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Stage real historical data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/ingest_historical.py --output-dir data/historical --execute
      - name: Run frozen A/B/C lockbox and financial evaluation
        run: python scripts/run_real_lockbox.py --staging data/historical --output data/results
      - name: Run regression suite
        run: python -m pytest -q
      - name: Upload real-data results
        uses: actions/upload-artifact@v7
        with:
          name: real-lockbox-results-${{ github.sha }}
          path: |
            data/results/
            data/historical/staging_result.json
            data/historical/source_manifest.json
          if-no-files-found: error
          retention-days: 30
