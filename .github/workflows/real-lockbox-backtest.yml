name: Real Historical Lockbox Backtest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-lockbox-main
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  stage-base:
    name: STAGE MARKET + FRED
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Runner diagnostics
        run: |
          python --version
          python -c "import os; print('CPUs:', os.cpu_count())"
          df -h
          free -h
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Stage base historical data without GDELT or SEC RSS
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "FRED/base staging attempt ${attempt}/3"
            python scripts/ingest_historical.py --output-dir data/historical --execute --skip-gdelt --skip-sec
            status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Base staging failed (exit ${status}); waiting 90s for transient API/rate-limit recovery..."
              rm -rf data/historical
              sleep 90
            fi
          done
          exit "$status"
      - name: Persist base staging
        uses: actions/upload-artifact@v7
        with:
          name: historical-base-${{ github.sha }}
          path: data/historical/
          if-no-files-found: error
          retention-days: 7

  prepare-gdelt-matrix:
    name: PREPARE 28-DAY GDELT MATRIX
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build 28-day chunk matrix
        id: matrix
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, json
          start = datetime.date(2015, 1, 1)
          end = datetime.date(2025, 12, 31)
          rows = []
          cur = start
          chunk = 1
          while cur <= end:
              chunk_end = min(cur + datetime.timedelta(days=27), end)
              rows.append({"chunk": chunk, "start": cur.isoformat(), "end": chunk_end.isoformat()})
              cur = chunk_end + datetime.timedelta(days=1)
              chunk += 1
          print("matrix=" + json.dumps({"include": rows}, separators=(",", ":")))
          print(f"chunks={len(rows)}", file=__import__('sys').stderr)
          PY

  gdelt-chunks:
    name: GDELT ${{ matrix.start }} → ${{ matrix.end }}
    needs: prepare-gdelt-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix: ${{ fromJSON(needs.prepare-gdelt-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Download and persist 28-day GDELT chunk
        run: |
          python scripts/ingest_gdelt_chunk.py \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --output "data/gdelt_chunks/gdelt_${{ matrix.chunk }}_${{ matrix.start }}_${{ matrix.end }}.csv" \
            --missing-output "data/gdelt_chunks/gdelt_${{ matrix.chunk }}_missing.csv"
      - name: Upload completed GDELT chunk and gap manifest
        uses: actions/upload-artifact@v7
        with:
          name: gdelt-${{ matrix.chunk }}-${{ matrix.start }}-${{ matrix.end }}
          path: data/gdelt_chunks/*.csv
          if-no-files-found: error
          retention-days: 7

  recover-gdelt-gaps:
    name: RECOVER GDELT GAPS ONLY
    needs: gdelt-chunks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Download GDELT chunk artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: gdelt-*
          path: data/gdelt_chunks
          merge-multiple: true
      - name: Retry only recorded missing source-days
        run: |
          python scripts/recover_gdelt_gaps.py \
            --chunks data/gdelt_chunks \
            --output data/gdelt_chunks/gdelt_recovered.csv \
            --remaining-output data/gdelt_chunks/gdelt_recovery_missing.csv
      - name: Upload recovery results
        uses: actions/upload-artifact@v7
        with:
          name: gdelt-recovery-${{ github.sha }}
          path: |
            data/gdelt_chunks/gdelt_recovered.csv
            data/gdelt_chunks/gdelt_recovery_missing.csv
          if-no-files-found: error
          retention-days: 7

  finalize-staging:
    name: ASSEMBLE + HISTORICAL GATE
    needs: [stage-base, recover-gdelt-gaps]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Download base staging
        uses: actions/download-artifact@v8
        with:
          name: historical-base-${{ github.sha }}
          path: data/historical
      - name: Download persisted GDELT chunks
        uses: actions/download-artifact@v8
        with:
          pattern: gdelt-*
          path: data/gdelt_chunks
          merge-multiple: true
      - name: Download GDELT recovery results
        uses: actions/download-artifact@v8
        with:
          name: gdelt-recovery-${{ github.sha }}
          path: data/gdelt_chunks
      - name: Assemble and validate historical staging
        run: python scripts/finalize_historical_staging.py --staging data/historical --chunks data/gdelt_chunks
      - name: Persist final historical staging
        uses: actions/upload-artifact@v7
        with:
          name: historical-final-${{ github.sha }}
          path: data/historical/
          if-no-files-found: error
          retention-days: 30

  real-lockbox:
    name: REAL DATA → PIT → A/B/C → LOCKBOX → FINANCIAL REPORT
    needs: finalize-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Download final historical staging
        uses: actions/download-artifact@v8
        with:
          name: historical-final-${{ github.sha }}
          path: data/historical
      - name: Run frozen A/B/C lockbox and financial evaluation
        run: python scripts/run_real_lockbox.py --staging data/historical --output data/results
      - name: Run regression suite
        run: python -m pytest -q
      - name: Upload real-data results
        uses: actions/upload-artifact@v7
        with:
          name: real-lockbox-results-${{ github.sha }}
          path: |
            data/results/
            data/historical/staging_result.json
            data/historical/source_manifest.json
          if-no-files-found: error
          retention-days: 30
